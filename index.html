<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Daily Bread — A fresh Biblical message every day. Read today's verse, devotional, or prayer.">
  <meta name="theme-color" content="#3F5F52">
  <title>Daily Bread — Today's Message</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Malayalam:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- Mobile & PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
</head>
<body data-page="home">

  <!-- ─── Drawer Overlay ───────────────────────────────────────── -->
  <div class="drawer-overlay" id="drawer-overlay" role="presentation"></div>

  <!-- ─── Navigation Drawer ───────────────────────────────────── -->
  <nav class="drawer" id="app-drawer" role="navigation" aria-label="Main navigation">
    <div class="drawer-header">
      <div class="drawer-logo" data-i18n="appName">Daily Bread</div>
      <div class="drawer-tagline" data-i18n="tagline">God's Word, Every Day</div>
    </div>

    <ul class="drawer-nav" style="list-style:none">
      <li>
        <a href="index.html" data-nav="home" class="active" aria-current="page">
          <span class="nav-icon">🏠</span>
          <span data-i18n="home">Home</span>
        </a>
      </li>
      <li>
        <a href="counselling.html" data-nav="counselling">
          <span class="nav-icon">🕊️</span>
          <span data-i18n="counselling">Counselling</span>
        </a>
      </li>

      <li><div class="drawer-divider"></div></li>

      <li>
        <a href="#" onclick="return false;" style="cursor:default; padding-bottom:6px;">
          <span class="nav-icon">🌐</span>
          <span data-i18n="language">Language</span>
        </a>
        <div class="lang-toggle" style="padding: 0 24px 14px">
          <button class="lang-btn active" data-lang="en" onclick="window.switchLanguage('en')">English</button>
          <button class="lang-btn" data-lang="ml" onclick="window.switchLanguage('ml')">മലയാളം</button>
        </div>
      </li>

      <li>
        <a href="about.html" data-nav="about">
          <span class="nav-icon">ℹ️</span>
          <span data-i18n="about">About</span>
        </a>
      </li>
    </ul>

    <div class="drawer-footer">
      <p style="font-size:0.75rem;color:var(--text-light);text-align:center">
        Daily Bread © 2026
      </p>
    </div>
  </nav>

  <!-- ─── App Wrapper ──────────────────────────────────────────── -->
  <div class="app-wrapper">

    <!-- ─── Header ──────────────────────────────────────────────── -->
    <header class="app-header">
      <div class="logo" data-i18n="appName">Daily Bread</div>
      <button
        class="hamburger-btn"
        id="hamburger-btn"
        aria-label="Open navigation menu"
        aria-expanded="false"
        aria-controls="app-drawer"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </header>

    <!-- ─── Page Content ─────────────────────────────────────────── -->
    <main class="page-content">

      <!-- Notification Permission Banner -->
      <div class="notif-banner hidden" id="notif-permission-banner" role="complementary" aria-label="Notification permission">
        <div class="notif-banner-icon">🙏</div>
        <div class="notif-banner-text">
          <strong data-i18n="allowNotif">Prayer Reminders</strong>
          <p data-i18n="allowNotifSub">Allow notifications to receive the daily prayer reminder.</p>
        </div>
        <button class="notif-allow-btn" id="notif-allow-btn" data-i18n="allow">Allow</button>
        <button class="notif-dismiss-btn" id="notif-dismiss-btn" aria-label="Dismiss">✕</button>
      </div>

      <!-- Prayer Banner (shown during active prayer window) -->
      <div class="prayer-banner hidden" id="prayer-banner" role="complementary" aria-label="Prayer time">
        <div class="prayer-banner-icon">🙏</div>
        <div class="prayer-banner-text">
          <h3 data-i18n="prayerTitle">🙏 Prayer Time</h3>
          <p data-i18n="prayerBody">Take a moment to pause, pray, and be still.</p>
        </div>
        <button class="prayer-banner-close" id="prayer-dismiss" aria-label="Dismiss prayer banner">✕</button>
      </div>

      <!-- Greeting -->
      <p class="greeting" id="greeting">Good Evening</p>

      <!-- Refresh Button -->
      <div style="text-align:center;margin-bottom:16px">
        <button class="refresh-btn" id="refresh-btn" aria-label="Refresh message">
          <span class="refresh-icon">↻</span>
          <span data-i18n="refresh">Refresh</span>
        </button>
      </div>

      <!-- Message Container (dynamically populated) -->
      <div id="message-container" aria-live="polite" aria-label="Daily message">
        <!-- Skeleton shown while loading -->
        <div class="skeleton-card">
          <div class="skeleton skeleton-line w-40 h-20" style="margin-bottom:20px"></div>
          <div class="skeleton skeleton-line w-100"></div>
          <div class="skeleton skeleton-line w-100"></div>
          <div class="skeleton skeleton-line w-80"></div>
          <div class="skeleton skeleton-line w-60" style="margin-top:16px"></div>
        </div>
      </div>

    </main>
  </div>

  <!-- ─── App Script ────────────────────────────────────────────── -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
